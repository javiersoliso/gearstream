<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poses del curso</title>
  <style>
    html, body { margin: 0; background: #0b0e14; color: #e8e6df; font-family: system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 14px 18px 6px; }
    h1 { font-size: 18px; font-weight: 600; margin: 0; }
    #sub { color: #9aa3b2; font-size: 13px; flex: 1; min-width: 260px; }
    button { font: inherit; }
    #hand { font-size: 14px; padding: 5px 12px; border-radius: 8px; border: 1px solid #2a3344; background: #151b26; color: #e8e6df; cursor: pointer; }
    #bigwrap { position: relative; height: min(58vh, 560px); margin: 8px 18px; border: 1px solid #1e2533; border-radius: 10px; overflow: hidden; }
    #big { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #title { position: absolute; left: 16px; right: 16px; top: 12px; font-size: clamp(17px, 2.2vw, 24px); font-weight: 500; pointer-events: none; }
    #meta { position: absolute; left: 16px; top: 46px; font-size: 13px; color: #9aa3b2; pointer-events: none; }
    #upbig { position: absolute; left: 16px; bottom: 14px; font-size: 22px; color: #ffd166; pointer-events: none; }
    #time { position: absolute; right: 16px; bottom: 14px; font-size: 13px; color: #6f7888; font-variant-numeric: tabular-nums; pointer-events: none; }
    #beep { position: absolute; right: 16px; top: 12px; font-size: 28px; font-weight: 700; color: #ffd166; opacity: 0; transition: opacity 0.1s; pointer-events: none; }
    #ballwrap { position: absolute; right: 22px; top: 60px; width: 22px; height: 172px; border-radius: 11px; background: #1c2230; display: none; }
    #ball { position: absolute; left: 1px; width: 20px; height: 20px; border-radius: 50%; background: #58c4dd; }
    #legend { margin: 0 18px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: #9aa3b2; }
    #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; padding: 14px 18px 30px; }
    .tile { position: relative; padding: 0; border: 1px solid #1e2533; border-radius: 10px; background: #0f131b; color: inherit; cursor: pointer; text-align: left; overflow: hidden; }
    .tile.on { border-color: #58c4dd; }
    .tile canvas { width: 100%; aspect-ratio: 320 / 220; display: block; }
    .tile .up { position: absolute; right: 8px; top: 6px; font-size: 13px; color: #ffd166; }
    .tile .cap { padding: 8px 10px 10px; font-size: 13px; line-height: 1.35; color: #cfd6e4; }
    .tile .cap b { color: #58c4dd; margin-right: 4px; }
    #keys { color: #6f7888; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Grabación del curso · las poses</h1>
    <span id="sub">cargando…</span>
    <button id="hand"></button>
    <span id="keys">← → paso · M muñeca · arrastra para girar</span>
  </header>
  <div id="bigwrap">
    <canvas id="big"></canvas>
    <div id="title"></div><div id="meta"></div><div id="upbig"></div><div id="time"></div>
    <div id="beep">♪ ¡ahora!</div>
    <div id="ballwrap"><div id="ball"></div></div>
  </div>
  <div id="legend">
    <span><i style="background:#1d9e75"></i>el reloj (la pantalla)</span>
    <span><i style="background:#a99bff"></i>x</span><span><i style="background:#f28ab2"></i>y</span><span><i style="background:#ff9a6b"></i>z del reloj</span>
    <span><i style="background:#ffd166"></i>gravedad (arriba)</span>
    <span><i style="background:#58c4dd"></i>el rayo al apuntar</span>
  </div>
  <div id="grid"></div>
  <script src="vendor/three.min.js"></script>
  <script>window.THREE || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
  <script src="vendor/OrbitControls.js"></script>
  <script>(window.THREE && THREE.OrbitControls) || document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>');</script>
  <script src="wrist.js"></script>
  <script src="mocapmath.js"></script>
  <script src="cursodemos.js"></script>
  <script src="stickdemo.js"></script>
  <script src="poses.js"></script>
</body>
</html>
