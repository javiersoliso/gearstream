<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GearStream · avatar</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    header.top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
    header.top .brand a { color: var(--text-secondary); text-decoration: none; }
    header.top label { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
    header.top select, header.top button { font: inherit; }
    #estado { color: var(--text-secondary); }
    #views { flex: 1; position: relative; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 3fr 2fr; gap: 6px; padding: 6px; }
    #gl { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .view { position: relative; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; z-index: 1; }
    .view.orbit { grid-column: 1 / 3; cursor: grab; }
    .view .tag { position: absolute; left: 10px; top: 8px; font-size: 12px; color: var(--text-secondary); background: var(--surface-1); padding: 2px 8px; border-radius: 8px; pointer-events: none; }
    .view .num { position: absolute; right: 10px; top: 8px; font-size: 12px; line-height: 1.5; color: var(--text-primary); background: var(--surface-1); padding: 4px 10px; border-radius: 8px; pointer-events: none; white-space: pre; font-variant-numeric: tabular-nums; }
    .hint { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--text-secondary); pointer-events: none; }
    @media (max-width: 700px) { #views { grid-template-columns: 1fr; grid-template-rows: 2fr 1fr 1fr; } .view.orbit { grid-column: 1; } }
  </style>
</head>
<body>
  <header class="top">
    <span class="brand"><a href="/">GearStream</a> · avatar 3D del brazo izquierdo</span>
    <span id="estado">conectando…</span>
    <label><input type="checkbox" id="autoCenter" checked> auto-centrar rumbo</label>
    <label>eje del antebrazo (hacia la mano) <select id="forearmAxis"><option value="+x">+x del reloj</option><option value="-x">−x del reloj</option><option value="+y">+y del reloj</option><option value="-y">−y del reloj</option></select></label>
    <button id="reset" title="tecla R">Reiniciar rumbo (R)</button>
    <label><input type="checkbox" id="showAxes" checked> ejes del reloj</label>
    <label title="estima el codo con la aceleración del reloj y los límites del brazo"><input type="checkbox" id="filterOn" checked> filtro con acelerómetro</label>
    <label><input type="checkbox" id="showCloud" checked> nube de codos posibles</label>
  </header>
  <div id="views">
    <canvas id="gl"></canvas>
    <div class="view orbit" id="vOrbit"><span class="tag">tercera persona · arrastra para orbitar</span><span class="num" id="numOrbit"></span><span class="hint">verde: antebrazo medido por el reloj · gris: brazo estimado · naranja: codos que el filtro aún considera posibles</span></div>
    <div class="view" id="vPov"><span class="tag">POV (como VR)</span></div>
    <div class="view" id="vArm"><span class="tag">solo el brazo</span><span class="num" id="numArm"></span></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="wrist.js"></script>
  <script src="armfilter.js"></script>
  <script src="avatar.js"></script>
</body>
</html>
