<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dataset de gestos</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0f1218; color: #ece9e1; font-family: system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr auto; }
    header { display: flex; justify-content: space-between; padding: 14px 20px; font-size: 13px; color: #9aa3b2; }
    #rates b { color: #ece9e1; font-weight: 500; }
    #rates.warn b { color: #f0997b; }
    main { display: grid; place-items: center; text-align: center; padding: 0 24px; }
    #step { font-size: 14px; color: #9aa3b2; letter-spacing: 0.04em; margin-bottom: 18px; }
    #line { font-size: clamp(26px, 4.2vw, 52px); line-height: 1.25; max-width: 1100px; font-weight: 500; transition: color 0.2s; }
    #line.prep { color: #6c7686; }
    #state { margin-top: 26px; font-size: 18px; color: #9aa3b2; min-height: 1.6em; }
    #state .rec { color: #ff6b6b; }
    #now { margin-top: 10px; font-size: 64px; font-weight: 700; color: #ffd166; opacity: 0; transition: opacity 0.12s; min-height: 80px; }
    #metro { position: relative; width: 26px; height: 220px; margin: 18px auto 0; border-radius: 13px; background: #1c2230; display: none; }
    #ball { position: absolute; left: 1px; width: 24px; height: 24px; border-radius: 50%; background: #58c4dd; }
    footer { padding: 12px 20px 18px; }
    #bar { height: 6px; background: #1c2230; border-radius: 3px; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #58c4dd; }
    #keys { margin-top: 10px; font-size: 12px; color: #6c7686; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    #saved { color: #5dcaa5; }
    button { font: inherit; font-size: 18px; padding: 10px 26px; border-radius: 10px; border: 1px solid #58c4dd; background: transparent; color: #ece9e1; cursor: pointer; margin-top: 24px; }
    #demowrap { display: none; position: relative; width: min(84vw, 620px); margin: 0 auto 16px; }
    #demo { display: block; width: 100%; aspect-ratio: 16 / 10; border-radius: 10px; border: 1px solid #1c2230; }
    #demowrap #metro { position: absolute; right: -44px; top: 50%; margin: -110px 0 0; }   /* con muñeco, la bolita va a su lado */
  </style>
</head>
<body>
  <header><span id="title">Dataset de gestos · GearStream</span><span id="rates">conectando…</span></header>
  <main>
    <div>
      <div id="demowrap"><canvas id="demo"></canvas></div>
      <div id="step"></div>
      <div id="line">Unos 5 minutos, 13 pasos. Cada paso es una línea: mientras se muestra, se graba.</div>
      <div id="state">Reloj en la muñeca izquierda, pantalla del reloj encendida (tócala), ratón aéreo apagado.</div>
      <div id="now">¡ahora!</div>
      <div id="metro"><div id="ball"></div></div>
      <button id="start">Empezar (Espacio)</button>
    </div>
  </main>
  <footer>
    <div id="bar"><div id="fill"></div></div>
    <div id="keys"><span>Espacio: pausa · R: repetir el paso anterior · → saltar</span><span id="saved"></span></div>
  </footer>
  <script src="vendor/three.min.js"></script>
  <script>window.THREE || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
  <script src="wrist.js"></script>
  <script src="mocapmath.js"></script>
  <script src="cursodemos.js"></script>
  <script src="stickdemo.js"></script>
  <script src="dataset.js"></script>
</body>
</html>
